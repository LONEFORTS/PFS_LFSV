<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 190">
  <defs>
    <linearGradient id="fg-petalM" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0%" stop-color="#FAF1E6"/>
      <stop offset="58%" stop-color="#F2D6C9"/>
      <stop offset="100%" stop-color="#DFA195"/>
    </linearGradient>
    <linearGradient id="fg-petalB" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0%" stop-color="#F6E8DB"/>
      <stop offset="55%" stop-color="#EEC9BB"/>
      <stop offset="100%" stop-color="#D69388"/>
    </linearGradient>
    <linearGradient id="fg-blG" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0%" stop-color="#F7E9DF"/>
      <stop offset="100%" stop-color="#D89A8E"/>
    </linearGradient>
    <radialGradient id="fg-leaf" cx="50%" cy="45%" r="68%">
      <stop offset="0%" stop-color="#ACBA8D"/>
      <stop offset="100%" stop-color="#62734B"/>
    </radialGradient>
    <radialGradient id="fg-pod" cx="50%" cy="38%" r="72%">
      <stop offset="0%" stop-color="#EDD08A"/>
      <stop offset="70%" stop-color="#C9A55C"/>
      <stop offset="100%" stop-color="#A87F34"/>
    </radialGradient>
    <path id="fg-p" d="M0 0 C -30 -18 -38 -78 0 -128 C 38 -78 30 -18 0 0 Z"/>
    <path id="fg-lf" d="M0 0 C -15 -7 -22 -28 0 -48 C 22 -28 15 -7 0 0 Z"/>
    <g id="fg-bloom">
      <g fill="url(#fg-blG)" stroke="#B8746A" stroke-width="1">
        <path d="M0 0 C -13 -8 -17 -30 0 -46 C 17 -30 13 -8 0 0 Z"/>
        <path d="M0 0 C -13 -8 -17 -30 0 -46 C 17 -30 13 -8 0 0 Z" transform="rotate(72)"/>
        <path d="M0 0 C -13 -8 -17 -30 0 -46 C 17 -30 13 -8 0 0 Z" transform="rotate(144)"/>
        <path d="M0 0 C -13 -8 -17 -30 0 -46 C 17 -30 13 -8 0 0 Z" transform="rotate(216)"/>
        <path d="M0 0 C -13 -8 -17 -30 0 -46 C 17 -30 13 -8 0 0 Z" transform="rotate(288)"/>
      </g>
      <circle r="7" fill="url(#fg-pod)" stroke="#8A6420" stroke-width="1"/>
    </g>
  </defs>

  <!-- baseline -->
  <path d="M40 168 H880" stroke="#B08840" stroke-width="1" opacity="0.5"/>
  <rect x="455" y="163" width="10" height="10" transform="rotate(45 460 168)" fill="#B08840" opacity="0.9"/>

  <!-- leaf -->
  <g transform="translate(252 148)">
    <path d="M0 -60 C 33 -60 60 -31 60 0 C 60 31 33 60 0 60 C -33 60 -60 31 -60 0 C -60 -31 -33 -60 0 -60 Z" fill="url(#fg-leaf)"/>
    <path d="M0 0 L0 -52 M0 0 L45 -26 M0 0 L45 26 M0 0 L0 52 M0 0 L-45 26 M0 0 L-45 -26" stroke="#4F6039" stroke-width="1.6" opacity="0.5" fill="none"/>
  </g>

  <!-- lotus -->
  <path d="M330 132 C 336 148 334 158 330 168" fill="none" stroke="#6B7C53" stroke-width="4" stroke-linecap="round"/>
  <g transform="translate(330 132) scale(0.5)">
    <g stroke="#B8746A" stroke-width="1.4" opacity="0.92">
      <use href="#fg-p" transform="rotate(-50) scale(1.12)" fill="url(#fg-petalB)"/>
      <use href="#fg-p" transform="rotate(-25) scale(1.12)" fill="url(#fg-petalB)"/>
      <use href="#fg-p" transform="scale(1.12)" fill="url(#fg-petalB)"/>
      <use href="#fg-p" transform="rotate(25) scale(1.12)" fill="url(#fg-petalB)"/>
      <use href="#fg-p" transform="rotate(50) scale(1.12)" fill="url(#fg-petalB)"/>
    </g>
    <g stroke="#C9938A" stroke-width="1.4">
      <use href="#fg-p" transform="rotate(-36)" fill="url(#fg-petalM)"/>
      <use href="#fg-p" transform="rotate(-12)" fill="url(#fg-petalM)"/>
      <use href="#fg-p" transform="rotate(12)" fill="url(#fg-petalM)"/>
      <use href="#fg-p" transform="rotate(36)" fill="url(#fg-petalM)"/>
    </g>
    <ellipse cx="0" cy="-26" rx="30" ry="20" fill="url(#fg-pod)" stroke="#8A6420" stroke-width="2"/>
    <g fill="#8A6420">
      <circle cx="-11" cy="-30" r="3.4"/><circle cx="0" cy="-33" r="3.4"/><circle cx="11" cy="-30" r="3.4"/>
    </g>
  </g>

  <!-- right branch -->
  <path d="M430 150 C 520 120 640 96 780 84" fill="none" stroke="#6E5636" stroke-width="4" stroke-linecap="round"/>
  <path d="M560 112 C 580 96 596 88 616 84" fill="none" stroke="#6E5636" stroke-width="2.5" stroke-linecap="round"/>
  <use href="#fg-bloom" transform="translate(520 118) scale(0.75)"/>
  <use href="#fg-bloom" transform="translate(650 98) rotate(14) scale(0.85)"/>
  <use href="#fg-bloom" transform="translate(770 84) rotate(-12) scale(0.65)"/>
  <use href="#fg-bloom" transform="translate(616 84) scale(0.5)"/>
  <g fill="#86986C" stroke="#57683F" stroke-width="1">
    <use href="#fg-lf" transform="translate(470 132) rotate(70) scale(0.9)"/>
    <use href="#fg-lf" transform="translate(590 106) rotate(-60) scale(0.8)"/>
    <use href="#fg-lf" transform="translate(710 90) rotate(80) scale(0.9)"/>
  </g>

  <!-- left twig -->
  <path d="M300 142 C 240 122 190 110 150 106" fill="none" stroke="#6E5636" stroke-width="3" stroke-linecap="round"/>
  <use href="#fg-bloom" transform="translate(150 106) rotate(-10) scale(0.6)"/>
  <path d="M0 0 C -7 -4 -9 -16 0 -26 C 9 -16 7 -4 0 0 Z" transform="translate(208 114) rotate(-40)" fill="#D89A8E" stroke="#B8746A"/>
  <use href="#fg-lf" transform="translate(250 126) rotate(-70) scale(0.8)" fill="#86986C" stroke="#57683F"/>

  <!-- gold dots -->
  <g fill="#B08840" opacity="0.85">
    <circle cx="410" cy="120" r="2.2"/><circle cx="560" cy="70" r="2"/><circle cx="200" cy="80" r="2"/>
  </g>
</svg>
