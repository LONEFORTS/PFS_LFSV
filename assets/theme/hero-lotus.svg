    <g stroke="#7C8B5F">
      <path d="M400 660 C 460 620 490 570 500 520"/>
      <path d="M480 560 C 495 545 512 542 520 552" fill="none"/>
      <circle cx="500" cy="520" r="6" fill="#B8746A" fill-opacity="0.4" stroke="#B8746A"/>
