      <circle cx="-18" cy="-10" r="2.5" fill="#B08840" stroke="none"/>
      <circle cx="18" cy="-10" r="2.5" fill="#B08840" stroke="none"/>
      <circle cx="-32" cy="5" r="2" fill="#B08840" stroke="none"/>
      <circle cx="32" cy="5" r="2" fill="#B08840" stroke="none"/>
    </g>
    <!-- Stem -->
    <path d="M280 580 C 300 520 260 460 280 400" stroke-width="1.4"/>
    <!-- Water ripples -->
    <path d="M80 620 Q 200 610 320 620 T 520 620" stroke-opacity="0.7"/>
    <path d="M100 640 Q 240 632 380 640 T 540 640" stroke-opacity="0.35"/>
    <path d="M60 660 Q 220 650 360 660 T 540 656" stroke-opacity="0.22"/>
    <!-- Lotus leaf (pad) -->
    <g transform="translate(140,600)">
      <path d="M-90 0 C -90 -50 -20 -80 60 -60 C 100 -30 100 20 60 40 C 0 60 -70 40 -90 0 Z" fill="#7C8B5F" fill-opacity="0.28" stroke="#7C8B5F"/>
