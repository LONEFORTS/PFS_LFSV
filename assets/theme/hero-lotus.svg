      <path d="M0 220 C 160 190 210 90 180 -20 C 110 0 40 60 0 160"/>
      <path d="M0 200 C -110 170 -150 90 -130 0 C -70 20 -10 70 0 150"/>
      <path d="M0 200 C 110 170 150 90 130 0 C 70 20 10 70 0 150"/>
      <path d="M0 180 C -60 130 -70 60 -50 0 C -20 40 0 90 0 160" />
      <path d="M0 180 C 60 130 70 60 50 0 C 20 40 0 90 0 160" />
      <path d="M0 170 C -20 110 -20 40 0 -20 C 20 40 20 110 0 170 Z" fill="#FFF6E1" fill-opacity="0.7"/>
