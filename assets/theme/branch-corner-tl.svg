<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 520">
  <defs>
    <linearGradient id="blG" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0%" stop-color="#F7E9DF"/>
      <stop offset="100%" stop-color="#D89A8E"/>
    </linearGradient>
    <linearGradient id="bleafG" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0%" stop-color="#9CAE7E"/>
      <stop offset="100%" stop-color="#62734B"/>
    </linearGradient>
    <radialGradient id="bc-podG" cx="50%" cy="38%" r="72%">
      <stop offset="0%" stop-color="#EDD08A"/>
      <stop offset="70%" stop-color="#C9A55C"/>
      <stop offset="100%" stop-color="#A87F34"/>
    </radialGradient>
    <path id="bleaf" d="M0 0 C -15 -7 -22 -28 0 -48 C 22 -28 15 -7 0 0 Z"/>
    <g id="bloom">
      <g fill="url(#blG)" stroke="#B8746A" stroke-width="1">
        <path d="M0 0 C -13 -8 -17 -30 0 -46 C 17 -30 13 -8 0 0 Z"/>
        <path d="M0 0 C -13 -8 -17 -30 0 -46 C 17 -30 13 -8 0 0 Z" transform="rotate(72)"/>
        <path d="M0 0 C -13 -8 -17 -30 0 -46 C 17 -30 13 -8 0 0 Z" transform="rotate(144)"/>
        <path d="M0 0 C -13 -8 -17 -30 0 -46 C 17 -30 13 -8 0 0 Z" transform="rotate(216)"/>
        <path d="M0 0 C -13 -8 -17 -30 0 -46 C 17 -30 13 -8 0 0 Z" transform="rotate(288)"/>
      </g>
      <circle r="7" fill="url(#bc-podG)" stroke="#8A6420" stroke-width="1"/>
      <g fill="#8A6420">
        <circle cx="0" cy="-4" r="1.2"/><circle cx="3.8" cy="-1.2" r="1.2"/><circle cx="2.4" cy="3.2" r="1.2"/>
        <circle cx="-2.4" cy="3.2" r="1.2"/><circle cx="-3.8" cy="-1.2" r="1.2"/>
      </g>
    </g>
    <path id="bbud" d="M0 0 C -7 -4 -9 -16 0 -26 C 9 -16 7 -4 0 0 Z"/>
  </defs>

  <!-- branch -->
  <g fill="none" stroke="#6E5636" stroke-linecap="round">
    <path d="M-24 -24 C 90 30 170 62 232 152 C 282 224 302 302 342 384" stroke-width="7"/>
    <path d="M118 26 C 158 58 188 100 204 150" stroke-width="4"/>
    <path d="M234 154 C 282 172 322 192 362 224" stroke-width="4"/>
    <path d="M182 92 C 202 60 224 40 254 30" stroke-width="3.5"/>
    <path d="M60 -6 C 96 10 126 32 148 64" stroke-width="4"/>
  </g>

  <!-- leaves -->
  <g fill="url(#bleafG)" stroke="#57683F" stroke-width="1">
    <use href="#bleaf" transform="translate(90 12) rotate(60)"/>
    <use href="#bleaf" transform="translate(160 60) rotate(100) scale(1.1)"/>
    <use href="#bleaf" transform="translate(250 170) rotate(40)"/>
    <use href="#bleaf" transform="translate(310 300) rotate(80) scale(1.1)"/>
    <use href="#bleaf" transform="translate(210 60) rotate(-30) scale(0.9)"/>
    <use href="#bleaf" transform="translate(370 262) rotate(120)"/>
  </g>

  <!-- blossoms -->
  <use href="#bloom" transform="translate(204 150) scale(1.05)"/>
  <use href="#bloom" transform="translate(342 384) rotate(15) scale(1.2)"/>
  <use href="#bloom" transform="translate(362 224) rotate(-20) scale(0.85)"/>
  <use href="#bloom" transform="translate(254 30) rotate(30) scale(0.8)"/>
  <use href="#bloom" transform="translate(148 64) rotate(-15) scale(0.7)"/>

  <!-- buds -->
  <use href="#bbud" transform="translate(300 250) rotate(40)" fill="#D89A8E" stroke="#B8746A"/>
  <use href="#bbud" transform="translate(170 110) rotate(-50) scale(0.9)" fill="#D89A8E" stroke="#B8746A"/>

  <!-- gold accents -->
  <g fill="#B08840" opacity="0.85">
    <circle cx="236" cy="110" r="2.2"/><circle cx="330" cy="330" r="2.2"/><circle cx="120" cy="96" r="1.8"/>
  </g>
</svg>
