<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 800">
  <defs>
    <radialGradient id="leafG" cx="50%" cy="45%" r="68%">
      <stop offset="0%" stop-color="#ACBA8D"/>
      <stop offset="55%" stop-color="#86986C"/>
      <stop offset="100%" stop-color="#62734B"/>
    </radialGradient>
    <radialGradient id="leafG2" cx="50%" cy="45%" r="68%">
      <stop offset="0%" stop-color="#BCC79F"/>
      <stop offset="58%" stop-color="#96A577"/>
      <stop offset="100%" stop-color="#6E7F56"/>
    </radialGradient>
    <linearGradient id="petalB" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0%" stop-color="#F6E8DB"/>
      <stop offset="55%" stop-color="#EEC9BB"/>
      <stop offset="100%" stop-color="#D69388"/>
    </linearGradient>
    <linearGradient id="petalM" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0%" stop-color="#FAF1E6"/>
      <stop offset="58%" stop-color="#F2D6C9"/>
      <stop offset="100%" stop-color="#DFA195"/>
    </linearGradient>
    <linearGradient id="petalF" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0%" stop-color="#FDF7EE"/>
      <stop offset="68%" stop-color="#F5E0D3"/>
      <stop offset="100%" stop-color="#E3ADA1"/>
    </linearGradient>
    <radialGradient id="podG" cx="50%" cy="38%" r="72%">
      <stop offset="0%" stop-color="#EDD08A"/>
      <stop offset="70%" stop-color="#C9A55C"/>
      <stop offset="100%" stop-color="#A87F34"/>
    </radialGradient>
    <path id="petal" d="M0 0 C -30 -18 -38 -78 0 -128 C 38 -78 30 -18 0 0 Z"/>
  </defs>

  <!-- stems -->
  <g fill="none" stroke="#6B7C53" stroke-linecap="round">
    <path d="M330 448 C 342 560 322 650 302 736" stroke-width="6" opacity="0.85"/>
    <path d="M152 548 C 160 620 150 690 132 762" stroke-width="5" opacity="0.8"/>
  </g>

  <!-- back leaf -->
  <g transform="translate(436 636) rotate(-10)">
    <path d="M0 -192 C 106 -192 196 -100 196 0 C 196 100 106 192 0 192 C -106 192 -196 100 -196 0 C -196 -100 -106 -192 0 -192 Z" fill="url(#leafG2)"/>
    <path d="M0 0 L0 -180 M0 0 L90 -156 M0 0 L156 -90 M0 0 L180 0 M0 0 L156 90 M0 0 L90 156 M0 0 L0 180 M0 0 L-90 156 M0 0 L-156 90 M0 0 L-180 0 M0 0 L-156 -90 M0 0 L-90 -156" stroke="#57683F" stroke-width="2" opacity="0.45" fill="none"/>
    <path d="M0 -192 C 106 -192 196 -100 196 0 C 196 100 106 192 0 192 C -106 192 -196 100 -196 0 C -196 -100 -106 -192 0 -192 Z" fill="none" stroke="#57683F" stroke-width="3" opacity="0.6"/>
    <circle r="10" fill="#57683F" opacity="0.5"/>
  </g>

  <!-- front leaf -->
  <g transform="translate(210 690) rotate(14)">
    <path d="M0 -150 C 83 -150 150 -78 150 0 C 150 78 83 150 0 150 C -83 150 -150 78 -150 0 C -150 -78 -83 -150 0 -150 Z" fill="url(#leafG)"/>
    <path d="M0 0 L0 -136 M0 0 L68 -118 M0 0 L118 -68 M0 0 L136 0 M0 0 L118 68 M0 0 L68 118 M0 0 L0 136 M0 0 L-68 118 M0 0 L-118 68 M0 0 L-136 0 M0 0 L-118 -68 M0 0 L-68 -118" stroke="#4F6039" stroke-width="2" opacity="0.5" fill="none"/>
    <path d="M0 -150 C 83 -150 150 -78 150 0 C 150 78 83 150 0 150 C -83 150 -150 78 -150 0 C -150 -78 -83 -150 0 -150 Z" fill="none" stroke="#4F6039" stroke-width="3" opacity="0.65"/>
    <circle r="8" fill="#4F6039" opacity="0.5"/>
  </g>

  <!-- bud on its stem -->
  <g transform="translate(150 545) rotate(-14)">
    <path d="M0 0 C -22 -12 -26 -64 0 -100 C 26 -64 22 -12 0 0 Z" fill="url(#petalM)" stroke="#C9938A" stroke-width="1.2"/>
    <path d="M0 -4 C -9 -32 -9 -70 0 -96" stroke="#B8746A" stroke-width="1" fill="none" opacity="0.7"/>
    <path d="M0 2 C -18 -6 -30 -30 -32 -58 C -14 -46 -4 -24 0 2 Z" fill="#86986C" stroke="#57683F" stroke-width="1"/>
    <path d="M0 2 C 18 -6 30 -30 32 -58 C 14 -46 4 -24 0 2 Z" fill="#86986C" stroke="#57683F" stroke-width="1"/>
  </g>

  <!-- main lotus -->
  <g transform="translate(330 430)">
    <g stroke="#B8746A" stroke-width="1" opacity="0.92">
      <use href="#petal" transform="rotate(-66) scale(1.16)" fill="url(#petalB)"/>
      <use href="#petal" transform="rotate(-44) scale(1.16)" fill="url(#petalB)"/>
      <use href="#petal" transform="rotate(-22) scale(1.16)" fill="url(#petalB)"/>
      <use href="#petal" transform="scale(1.16)" fill="url(#petalB)"/>
      <use href="#petal" transform="rotate(22) scale(1.16)" fill="url(#petalB)"/>
      <use href="#petal" transform="rotate(44) scale(1.16)" fill="url(#petalB)"/>
      <use href="#petal" transform="rotate(66) scale(1.16)" fill="url(#petalB)"/>
    </g>
    <g stroke="#C9938A" stroke-width="1">
      <use href="#petal" transform="rotate(-50)" fill="url(#petalM)"/>
      <use href="#petal" transform="rotate(-25)" fill="url(#petalM)"/>
      <use href="#petal" fill="url(#petalM)"/>
      <use href="#petal" transform="rotate(25)" fill="url(#petalM)"/>
      <use href="#petal" transform="rotate(50)" fill="url(#petalM)"/>
    </g>
    <g stroke="#D89A8E" stroke-width="1">
      <use href="#petal" transform="rotate(-16) scale(0.8)" fill="url(#petalF)"/>
      <use href="#petal" transform="scale(0.8)" fill="url(#petalF)"/>
      <use href="#petal" transform="rotate(16) scale(0.8)" fill="url(#petalF)"/>
    </g>
    <!-- stamens -->
    <g transform="translate(0 -26)" stroke="#B08840" stroke-width="1.4" fill="#C9A55C">
      <g transform="rotate(0)"><line x1="0" y1="-18" x2="0" y2="-33"/><circle cx="0" cy="-35" r="2.2" stroke="none"/></g>
      <g transform="rotate(30)"><line x1="0" y1="-18" x2="0" y2="-33"/><circle cx="0" cy="-35" r="2.2" stroke="none"/></g>
      <g transform="rotate(60)"><line x1="0" y1="-18" x2="0" y2="-33"/><circle cx="0" cy="-35" r="2.2" stroke="none"/></g>
      <g transform="rotate(90)"><line x1="0" y1="-18" x2="0" y2="-33"/><circle cx="0" cy="-35" r="2.2" stroke="none"/></g>
      <g transform="rotate(120)"><line x1="0" y1="-18" x2="0" y2="-33"/><circle cx="0" cy="-35" r="2.2" stroke="none"/></g>
      <g transform="rotate(150)"><line x1="0" y1="-18" x2="0" y2="-33"/><circle cx="0" cy="-35" r="2.2" stroke="none"/></g>
      <g transform="rotate(180)"><line x1="0" y1="-18" x2="0" y2="-33"/><circle cx="0" cy="-35" r="2.2" stroke="none"/></g>
      <g transform="rotate(210)"><line x1="0" y1="-18" x2="0" y2="-33"/><circle cx="0" cy="-35" r="2.2" stroke="none"/></g>
      <g transform="rotate(240)"><line x1="0" y1="-18" x2="0" y2="-33"/><circle cx="0" cy="-35" r="2.2" stroke="none"/></g>
      <g transform="rotate(270)"><line x1="0" y1="-18" x2="0" y2="-33"/><circle cx="0" cy="-35" r="2.2" stroke="none"/></g>
      <g transform="rotate(300)"><line x1="0" y1="-18" x2="0" y2="-33"/><circle cx="0" cy="-35" r="2.2" stroke="none"/></g>
      <g transform="rotate(330)"><line x1="0" y1="-18" x2="0" y2="-33"/><circle cx="0" cy="-35" r="2.2" stroke="none"/></g>
    </g>
    <!-- gold pod -->
    <ellipse cx="0" cy="-26" rx="30" ry="20" fill="url(#podG)" stroke="#8A6420" stroke-width="1.5"/>
    <g fill="#8A6420">
      <circle cx="-12" cy="-31" r="2.8"/><circle cx="0" cy="-34" r="2.8"/><circle cx="12" cy="-31" r="2.8"/>
      <circle cx="-6" cy="-23" r="2.8"/><circle cx="6" cy="-23" r="2.8"/>
    </g>
  </g>

  <!-- gold pollen dots -->
  <g fill="#B08840" opacity="0.85">
    <circle cx="118" cy="300" r="2.6"/><circle cx="148" cy="258" r="2"/><circle cx="96" cy="350" r="1.8"/>
    <circle cx="522" cy="258" r="2.6"/><circle cx="552" cy="302" r="2"/><circle cx="500" cy="198" r="1.8"/>
  </g>
</svg>
